<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant (Kannada Chat)</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f6f7fb; }
        header { background: #2b6cb0; color: #fff; padding: 14px 18px; }
        header h1 { margin: 0; font-size: 18px; }
        #status { font-size: 12px; opacity: 0.9; }
        .container { max-width: 900px; margin: 16px auto; padding: 0 12px; }
        .chat { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 120px); }
        .messages { padding: 14px; overflow-y: auto; }
        .msg { margin: 8px 0; display: inline-block; max-width: 80%; padding: 10px 12px; border-radius: 12px; line-height: 1.4; }
        .user { background: #2b6cb0; color: #fff; border-top-right-radius: 4px; }
        .bot { background: #edf2f7; color: #1a202c; border-top-left-radius: 4px; }
        .row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; }
        textarea { flex: 1; resize: none; height: 46px; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 14px; }
        button { background: #2b6cb0; color: white; border: 0; border-radius: 8px; padding: 0 16px; font-size: 14px; cursor: pointer; }
        button[disabled] { opacity: 0.6; cursor: not-allowed; }
        .hint { font-size: 12px; color: #4a5568; margin: 8px 0 0; }
        .small { font-size: 12px; color: #718096; }
    </style>
</head>
<body>
    
    <header>
        <h1>ಕೃಷಿ ಸಹಾಯಕ ಚಾಟ್</h1>
        <div id="status">LLM: ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ…</div>
    </header>

    <div class="container">
        <div class="chat">
            <div id="messages" class="messages"></div>
            <div class="row">
                <textarea id="input" placeholder="ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ… (ಉದಾ: ಯಾವ ಗೊಬ್ಬರ ಬಳಸಬೇಕು?)"></textarea>
                <button id="send">ಕಳುಹಿಸಿ</button>
            </div>
        </div>
        <p class="hint">ಗಮನಿಸಿ: ಉತ್ತರಗಳು ಕನ್ನಡದಲ್ಲೇ ಸಣ್ಣವಾಗಿ ಬರುತ್ತವೆ. ಸಂಪರ್ಕ ಸ್ಥಿತಿ ಮೇಲ್ಭಾಗದಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ.</p>
    </div>

    <script>
        
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const statusEl = document.getElementById('status');

        function addMessage(text, who) {
            const wrap = document.createElement('div');
            wrap.style.display = 'flex';
            wrap.style.margin = '4px 0';
            wrap.style.justifyContent = who === 'user' ? 'flex-end' : 'flex-start';

            const el = document.createElement('div');
            el.className = 'msg ' + (who === 'user' ? 'user' : 'bot');
            el.textContent = text;
            wrap.appendChild(el);
            messages.appendChild(wrap);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            input.focus();
            sendBtn.disabled = true;

            try {
                const resp = await fetch('/api/assistant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await resp.json();
                const reply = data.reply || data.error || 'ಕ್ಷಮಿಸಿ, ಉತ್ತರ ಸಿಗಲಿಲ್ಲ.';
                addMessage(reply, 'bot');
            } catch (e) {
                addMessage('ಸಂಪರ್ಕ ದೋಷ. ನಂತರ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.', 'bot');
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Check LLM status on load
        (async function checkStatus() {
            try {
                const resp = await fetch('/llm-status');
                const data = await resp.json();
                if (data.ok) {
                    statusEl.textContent = `LLM: ${data.provider} (${data.model}) – OK`;
                } else {
                    statusEl.textContent = 'LLM: ಸಂಪರ್ಕ ಲಭ್ಯವಿಲ್ಲ. ಆದರೆ ಮೂಲಭೂತ ಉತ್ತರಗಳು ಲಭ್ಯವಿವೆ.';
                }
            } catch (e) {
                statusEl.textContent = 'LLM: ಸ್ಥಿತಿ ಪರಿಶೀಲನೆ ವಿಫಲವಾಯಿತು. ಆದರೆ ಮೂಲಭೂತ ಉತ್ತರಗಳು ಲಭ್ಯವಿವೆ.';
            }
        })();
    </script>
</body>
</section>
<section class="footer" style="background:#ffffff;padding:16px 9%;margin-top:20px;border-top:1px solid #eaeaea;color:#134f09">
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
    <div style="font-size:14px">Smart Fertilizer Recommendation System</div>
    <div style="font-size:13px">Created by Vidyashree</div>
  </div>
</section>
</html>
