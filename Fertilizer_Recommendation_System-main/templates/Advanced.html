<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Inputs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<style>
  @import url('https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap');
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; }
  body{ background-color:#ffffff; color:#0b3b1f; padding:10px; }
  :root{ --red:#008116; }
  @keyframes shimmer{ 0%{background-position:-1000px 0;} 100%{background-position:1000px 0;} }
  .shimmer{ animation:shimmer 8s infinite linear; background:linear-gradient(to right,#f6f6f6 40%,#e0e0e0 50%,#f6f6f6 60%); background-size:2000px 100%; -webkit-background-clip:text; background-clip:text; color:transparent; }
  header{ position:fixed; top:0; left:0; right:0; z-index:1000; background:#fff; box-shadow:0 .5rem 1rem rgba(0,0,0,.1); padding:10px; display:flex; align-items:center; justify-content:space-between; }
  header .logo{ font-size:2.2rem; font-weight:bolder; color:#666; text-decoration:none; }
  header .logo i{ padding-right:.5rem; color:var(--red); }
  header .navbar a{ font-size:1.6rem; margin-left:2rem; color:#004023; text-decoration:none; }
  
  .wrapper{ max-width:50rem; width:100%; background:#fff; margin:80px auto 40px; box-shadow:1px 1px 2px rgba(0,0,0,0.125); padding:30px; }
  .title{ font-size:24px; font-weight:700; margin-bottom:25px; color:#fec107; text-transform:uppercase; text-align:center; }
  .inputfield{ margin-bottom:15px; display:flex; align-items:center; }
  .inputfield label{ width:200px; color:#757575; margin-right:10px; font-size:14px; font-weight:bolder; }
  .custom_select{ position:relative; width:100%; height:37px; }
  .custom_select select{ appearance:none; outline:none; width:100%; height:100%; padding:8px 10px; font-size:15px; border:1px solid #d5dbd9; border-radius:3px; }
  .input{ width:100%; outline:none; border:1px solid #d5dbd9; font-size:15px; padding:8px 10px; border-radius:3px; transition:all .3s ease; }
  .btn{ width:100%; padding:8px 10px; font-size:15px; border:0; background:#149600; color:#fff; cursor:pointer; border-radius:3px; }
  .btn:hover{ background:#12d700; }
  /* Modal styles (same behavior as basic mode) */
  .modal{ position:fixed; left:0; right:0; top:0; bottom:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:2000; }
  .modal.show{ display:flex; }
  .modal-content{ background:#ffffff; max-width:520px; width:calc(100% - 40px); border-radius:8px; padding:20px 24px; box-shadow:0 10px 30px rgba(0,0,0,0.2); position:relative; }
  .modal-content h2{ margin:0 0 10px 0; color:#134f09; }
  .modal-content p{ font-size:18px; font-weight:700; margin:0 0 16px 0; }
  .modal-actions{ text-align:right; }
  .modal-close{ position:absolute; right:16px; top:12px; cursor:pointer; font-size:22px; }
</style>
<body>
  
  <header>
    <a href="{{ url_for('home') }}#home" class="logo"><i class="fas fa-seedling"></i><span class="shimmer">Ferti</span></a>
    <nav class="navbar">
      <a href="{{ url_for('Model1') }}">Model</a>
      <a href="{{ url_for('assistant_page') }}" target="_blank" title="Open Kannada Assistant"><i class="fas fa-comments"></i></a>
    </nav>
  </header>

  <div class="wrapper">
    <div class="title">Advanced Mode (All fields required)</div>
    <form method="post" action="{{ url_for('predict_advanced') }}" class="form" id="AdvancedForm" autocomplete="off">
      <div class="inputfield">
        <label for="Soil_Type">Soil Type:</label>
        <div class="custom_select">
          <select name="Soil_Type" id="Soil_Type" required>
            <option value="" selected disabled>-- Select Soil Type --</option>
            <option value="Loamy Soil">Loamy Soil</option>
            <option value="Peaty Soil">Peaty Soil</option>
            <option value="Acidic Soil">Acidic Soil</option>
            <option value="Neutral Soil">Neutral Soil</option>
            <option value="Alkaline Soil">Alkaline Soil</option>
          </select>
        </div>
      </div>

      <div class="inputfield">
        <label for="Crop_Type">Crop Type:</label>
        <div class="custom_select">
          <select name="Crop_Type" id="Crop_Type" required>
            <option value="" selected disabled>-- Select Crop Type --</option>
            <option value="Barley">Barley</option>
            <option value="Cotton">Cotton</option>
            <option value="Ground Nuts">Ground Nuts</option>
            <option value="Maize">Maize</option>
            <option value="Millets">Millets</option>
            <option value="Oil Seeds">Oil Seeds</option>
            <option value="Paddy">Paddy</option>
            <option value="Pulses">Pulses</option>
            <option value="Sugarcane">Sugarcane</option>
            <option value="Tobacco">Tobacco</option>
            <option value="Wheat">Wheat</option>
            <option value="coffee">Coffee</option>
            <option value="kidneybeans">Kidney Beans</option>
            <option value="orange">Orange</option>
            <option value="pomegranate">Pomegranate</option>
            <option value="rice">Rice</option>
            <option value="watermelon">Watermelon</option>
          </select>
        </div>
      </div>

      <div class="inputfield">
        <label for="Location">Location:</label>
        <div class="custom_select">
          <select name="Location" id="Location" required>
            <option value="" selected disabled>-- Select Location --</option>
            <option value="Mysore">Mysore</option>
            <option value="Mandya">Mandya</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Hassan">Hassan</option>
            <option value="Chamrajnagar">Chamrajnagar</option>
          </select>
        </div>
      </div>

      <div class="inputfield">
        <label for="Nitrogen">Nitrogen:</label>
        <input type="number" class="input" name="Nitrogen" id="Nitrogen" required>
      </div>
      <div class="inputfield">
        <label for="Phosphorus">Phosphorus:</label>
        <input type="number" class="input" name="Phosphorus" id="Phosphorus" required>
      </div>
      <div class="inputfield">
        <label for="Potassium">Potassium:</label>
        <input type="number" class="input" name="Potassium" id="Potassium" required>
      </div>

      <div class="inputfield">
        <label for="pH">pH:</label>
        <input type="number" class="input" name="pH" id="pH" step="0.1" required>
      </div>

      <div class="inputfield">
        <button type="submit" class="btn">Predict</button>
      </div>

    </form>
  </div>
  <script>
    // Create modal once
    (function(){
      var m = document.createElement('div');
      m.id = 'resultModal';
      m.className = 'modal';
      m.innerHTML = "<div class=\"modal-content\">"+
                    "<span id=\"modalClose\" class=\"modal-close\">&times;</span>"+
                    "<h2>Recommended Fertilizer For Your Crop Is:</h2>"+
                    "<p id=\"modalText\"></p>"+
                    "<div id=\"knExplain\" style=\"margin:8px 0;\"></div>"+
                    "<div class=\"modal-actions\">"+
                      "<button id=\"explainKnBtn\" class=\"btn\" style=\"width:auto;margin-right:8px\">Explain in Kannada</button>"+
                      "<a href=\"/assistant\" target=\"_blank\" class=\"btn\" style=\"width:auto;margin-right:8px;text-decoration:none;display:inline-block;text-align:center\">Open Kannada Assistant</a>"+
                      "<button id=\"modalOk\" class=\"btn\" style=\"width:auto\">OK</button>"+
                    "</div>"+
                    "</div>";
      document.body.appendChild(m);
    })();
    (function(){
      var formEl = document.getElementById('AdvancedForm');
      var modal = document.getElementById('resultModal');
      var modalText = null;
      var knExplain = null;
      var explainBtn = null;
      function ensureRefs(){ if(!modalText){ modalText = document.getElementById('modalText'); } }
      function openModal(text){ ensureRefs(); if(modalText){ modalText.textContent = text || ''; } modal.classList.add('show'); }
      function closeModal(){ modal.classList.remove('show'); }
      document.addEventListener('click', function(e){
        if(e.target && e.target.id === 'modalClose'){ e.preventDefault(); closeModal(); }
        if(e.target && e.target.id === 'modalOk'){ e.preventDefault(); closeModal(); }
      });
      modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });

      async function explainKannada(){
        try{
          ensureRefs();
          if(!knExplain){ knExplain = document.getElementById('knExplain'); }
          if(!explainBtn){ explainBtn = document.getElementById('explainKnBtn'); }
          var fertilizer = (modalText && modalText.textContent) ? modalText.textContent.trim() : '';
          var payload = {
            fertilizer: fertilizer,
            soil: document.getElementById('Soil_Type').value || '',
            crop: document.getElementById('Crop_Type').value || '',
            temperature: '',
            humidity: '',
            moisture: '',
            nitrogen: document.getElementById('Nitrogen').value || '',
            phosphorus: document.getElementById('Phosphorus').value || '',
            potassium: document.getElementById('Potassium').value || ''
          };
          if(knExplain){ knExplain.textContent = 'Generating Kannada explanation...'; }
          var resp = await fetch('/explain-kn', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
          var text = await resp.text();
          if(!resp.ok){ throw new Error('non-200'); }
          if(knExplain){ knExplain.textContent = text || 'No response.'; }
        }catch(err){ if(knExplain){ knExplain.textContent = 'Unable to fetch explanation.'; } }
      }

      if(formEl){
        formEl.addEventListener('submit', async function(e){
          e.preventDefault();
          var fd = new FormData(formEl);
          try{
            var resp = await fetch(formEl.action, { method: 'POST', headers: { 'X-Requested-With': 'fetch' }, body: fd });
            var text = await resp.text();
            openModal(text);
          }catch(err){
            openModal('Error predicting. Please try again.');
          }
        });
      }

      document.addEventListener('click', function(e){
        if(e && e.target && e.target.id === 'explainKnBtn'){
          e.preventDefault();
          explainKannada();
        }
      });
    })();
  </script>
</body>
</section>
<section class="footer" style="background:#ffffff;padding:16px 9%;margin-top:20px;border-top:1px solid #eaeaea;color:#134f09">
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
    <div style="font-size:14px">Smart Fertilizer Recommendation System</div>
    <div style="font-size:13px">Created by Vidyashree</div>
  </div>
</section>
</body>
</html>
